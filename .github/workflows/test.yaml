name: "Test"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "ShellCheck"
        run: shellcheck -x src/netselect/*.sh test/netselect/*.sh test/netselect/unit/*.sh

      - name: "Unit tests"
        run: test/netselect/unit/lib_test.sh

  scenarios:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v7

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # netselect_* scenarios need outbound ICMP, which GitHub-hosted runners block;
      # run those locally (see README).
      - name: "Scenario tests (explicit mirror and Ubuntu mirror://)"
        run: devcontainer features test --features netselect --filter mirror_ --skip-autogenerated .

      - name: "Autogenerated test (default options)"
        run: devcontainer features test --features netselect --skip-scenarios .
